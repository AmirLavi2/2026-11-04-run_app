plugins {
    id "com.android.application"
}

android {
    namespace "app.runtracker"
    compileSdk 36

    // Android only installs updates signed with the same key, and Google Drive access is tied to it.
    // This is Android's standard debug key and password, kept here so a new PC can still build updates.
    signingConfigs {
        debug {
            storeFile file("../signing/run-tracker.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "app.runtracker"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.8"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    testImplementation "junit:junit:4.13.2"
}
